backend:
  name: git-gateway
  branch: main # Branch to update (optional; defaults to master)

media_folder: 'public/uploads' # Where media files will be stored
public_folder: '/uploads' # Where the media files can be accessed from the server
publish_mode: editorial_workflow # For Drafts

collections:
  - name: 'blog' # Used in routes, e.g., /admin/collections/blog
    label: 'Blog' # Used in the UI
    folder: 'content/blogs' # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: '{{slug}}' # Filename template, e.g., YYYY-MM-DD-title.md
    fields: # The fields for each document, usually in front matter
      - { label: 'Title', name: 'title', widget: 'string' }
      # Each option must be the name of a city in utils/cities.js.
      - {
          label: 'City',
          name: 'city',
          widget: 'select',
          options: ['Ottawa-Gatineau', 'Fredericton'],
          default: 'Ottawa-Gatineau',
          required: false,
        }
      - { label: 'Layout', name: 'layout', widget: 'hidden', default: 'blog' }
      - { label: 'Cuisine', name: 'cuisine', widget: 'string' }
      - { label: 'Address', name: 'address', widget: 'string' }
      - {
          label: 'Area',
          name: 'area',
          widget: 'select',
          options:
            [
              'Barrhaven',
              'Carp',
              'Central Ottawa',
              'East Ottawa',
              'Gatineau',
              'Gloucester',
              'Kanata',
              'Manotick',
              'Nepean',
              'Orléans',
              'Richmond',
              'South Ottawa',
              'Stittsville',
              'Vanier',
              'West Ottawa',
            ],
          required: false,
        }
      - {
          label: 'Price per person (approx.)',
          name: 'price',
          widget: 'select',
          options: ['Under $15', '$15–$25', 'Over $25'],
          required: false,
        }
      - {
          label: 'Dietary options',
          name: 'dietary',
          widget: 'select',
          multiple: true,
          options:
            ['Vegan options', 'Vegetarian options', 'Gluten-free options', 'Halal'],
          required: false,
          hint: 'Tick only if the place has such dishes, not the whole menu. Tick Halal only if the restaurant says it is halal.',
        }
      - {
          label: "Writer's pick",
          name: 'favourite',
          widget: 'boolean',
          default: false,
          required: false,
        }
      - {
          label: 'Must-order dishes',
          name: 'mustOrder',
          widget: 'list',
          field: { label: 'Dish', name: 'dish', widget: 'string' },
          required: false,
        }
      - {
          label: 'Summary (search and social)',
          name: 'description',
          widget: 'text',
          required: false,
          hint: 'Optional. One or two sentences for Google results and link previews. If left blank, the first sentence of the post is used.',
        }
      - { label: 'Author', name: 'author', widget: 'string' }
      - {
          label: 'Publish Date',
          name: 'date',
          widget: 'datetime',
          date_format: 'DD.MM.YYYY',
          time_format: 'HH:mm',
          format: 'LLL',
        }
      - { label: 'Featured Image', name: 'thumbnail', widget: 'image' }
      - { label: 'Closed', name: 'closed', widget: 'boolean', default: false }
      - {
          label: 'Positive coordinates',
          name: 'positives',
          widget: 'number',
          value_type: 'float',
        }
      - {
          label: 'Negative coordinates',
          name: 'negatives',
          widget: 'number',
          value_type: 'float',
        }
      - { label: 'Body', name: 'body', widget: 'markdown' }
      - { label: 'Secondary image', name: 'image', widget: 'image' }
      - {
          label: 'YouTube video URL',
          name: 'youtube',
          widget: 'string',
          required: false,
          pattern:
            [
              '^https://(www\.|m\.)?(youtube\.com|youtu\.be)/',
              'Use a youtube.com or youtu.be link',
            ],
        }
      - {
          label: 'CBC clip page URL',
          name: 'cbc',
          widget: 'string',
          required: false,
          pattern: ['^https://(www\.)?cbc\.ca/', 'Use a cbc.ca link'],
        }
      - {
          label: 'CBC audio (mp3) URL',
          name: 'cbcAudio',
          widget: 'string',
          required: false,
          pattern:
            ['^https://([a-z0-9-]+\.)?cbc\.ca/', 'Use a cbc.ca audio link'],
        }
